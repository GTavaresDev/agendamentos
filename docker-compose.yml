services:
  postgres:
    image: postgres:16-alpine
    container_name: agendamentos-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agendamentos_db
    ports:
      - "5436:5432"
    volumes:
      - agendamentos_postgres_data:/var/lib/postgresql/data

volumes:
  agendamentos_postgres_data:
